<div id="app">
  <canvas id="game"></canvas>

       frame, so the UI code owns its own structure and can rebuild it. -->

  <div id="alerts" class="hud"></div>
  <div id="messages" class="hud"></div>
  <div id="letters" class="hud"></div>
  <div id="inspect" class="hud hidden"></div>
  <div id="architect" class="hud"></div>
  <div id="tab-panel" class="hud hidden"></div>
  <div id="float-menu" class="hud hidden"></div>
  <div id="tooltip" class="hud hidden"></div>
  <div id="menu" class="screen"></div>
  <div id="modal" class="screen hidden"></div>
</div>
