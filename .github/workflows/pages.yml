name: Check

on:
  push:
    branches:
      - main
      - master
      - claude/getaway-shootout-game-x4v0bp
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check every script
        run: |
          for f in js/*.js server/*.js; do
            node --check "$f" || exit 1
          done
      - name: Levels are completable and nothing respawns inside a hazard
        run: node tools/verify-levels.js
