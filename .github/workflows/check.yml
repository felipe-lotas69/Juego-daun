name: Check

on:
  push:
    branches:
      - main
      - master
      - claude/rimworld-web-clone-eiziry
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check every script
        run: for f in js/*.js tools/*.js; do node --check "$f" || exit 1; done
      - name: Defs are internally consistent
        run: node tools/verify-defs.js
      - name: A colony survives ten simulated days
        run: node tools/verify-sim.js
